services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course"]
      interval: 5s
      timeout: 5s
      retries: 10

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    command: ["migration", "apply", "/migrations"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: course
      DB_USER: course_migrator
      DB_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-dev-migrator-password}
      DB_PUBLISHER_USER: course_publisher
      DB_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-dev-publisher-password}
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080

      COURSE_JWT_ISSUER: moduledev-course
      COURSE_JWT_AUDIENCE: moduledev-api
      COURSE_JWT_SIGNING_KEY: ${COURSE_JWT_SIGNING_KEY:-change-me-signing-key-at-least-32-bytes}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: course
      DB_USER: course_runtime
      DB_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-dev-runtime-password}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      API_BASE_URL: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started

  worker-a:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      WORKER_LEASE_OWNER: worker-a

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: course
      DB_USER: workflow_worker
      DB_PASSWORD: ${WORKFLOW_WORKER_PASSWORD:-dev-worker-password}

      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}

      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-5000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully

  worker-b:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      WORKER_LEASE_OWNER: worker-b

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: course
      DB_USER: workflow_worker
      DB_PASSWORD: ${WORKFLOW_WORKER_PASSWORD:-dev-worker-password}

      COURSE_TEST_PROFILE: ${COURSE_TEST_PROFILE:-0}
      COURSE_FAILPOINT: ${COURSE_FAILPOINT:-}

      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-5000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}

    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully

volumes:
  postgres_data:
